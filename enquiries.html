<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegance Fragrance Co. | Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <img src="Logo.jpeg"
     alt="Elegance Fragrance Co. Logo"
     width="200">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="products.html">Products</a>
            <a href="services.html">Services</a>
            <a href="enquiries.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <h1>Product Enquiry</h1>

        <p>
            Complete the form below if you would like to enquire about
            one of our fragrances.
        </p>

        <form action="#" method="post">

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">

            <label for="collection">Collection:</label>
            <select id="collection" name="collection">

                <option value="">Select a collection</option>
                <option value="ladies">Ladies Collection</option>
                <option value="men">Men's Collection</option>

            </select>

            <label for="product">Product:</label>
            <select id="product" name="product">

                <option value="">Select a fragrance</option>
                <option value="noir">Noir</option>
                <option value="ember">Ember</option>
                <option value="azure">Azure</option>
                <option value="aure">Aure</option>
                <option value="element">Element</option>
                <option value="oceans">Oceans</option>
                <option value="autumn">Autumn</option>
                <option value="spring">Spring</option>
                <option value="nature">Nature</option>
                <option value="iqabunga">Iqabunga</option>

            </select>

            <label for="message">Your Enquiry:</label>
            <textarea id="message" name="message" rows="6"
                      required></textarea>

            <button type="submit">Submit Enquiry</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Elegance Fragrance Co. All rights reserved.</p>
    </footer>

</body>
</html>
